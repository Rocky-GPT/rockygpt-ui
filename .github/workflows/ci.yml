name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # High-severity production advisories block the build. Transitive pins
      # live in "overrides" rather than `npm audit fix`, which would pull a
      # Next major.
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npx playwright install chromium

      # The suite drives the rendered page, not the brain, so it runs without
      # the service. Chat itself answers 503 here, which these checks do not
      # assert on.
      - name: Accessibility tests
        run: npm run test:a11y
